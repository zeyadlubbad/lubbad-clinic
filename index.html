  const [hov, setHov] = useState(false);
  return <button disabled={disabled} onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
    style={{ border: "none", borderRadius: 10, fontSize: small ? 12 : 14, fontWeight: 600, cursor: disabled ? "default" : "pointer",
      padding: small ? "7px 14px" : "11px 18px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
      transition: "all 0.15s", fontFamily: "inherit", opacity: disabled ? 0.5 : hov ? 0.9 : 1,
      ...(full ? { width: "100%" } : {}),
      ...(v === "pri" ? { background: `linear-gradient(135deg, var(--pri), var(--priD))`, color: "#fff" } :
         v === "acc" ? { background: "var(--acc)", color: "#fff" } :
         v === "ok" ? { background: "var(--ok)", color: "#fff" } :
         v === "out" ? { background: "transparent", color: "var(--txt)", border: "1.5px solid var(--brd)" } :

};

const FileUpload = ({ label, onUpload, accept = "image/*" }) => {
  const ref = useRef();
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => onUpload({ name: file.name, data: reader.result, date: new Date().toLocaleDateString("ar") });
    reader.readAsDataURL(file);
  };
  return (
    <div>
      {label && <label style={{ fontSize: 12, color: "var(--txtL)", marginBottom: 4, display: "block" }}>{label}</label>}
      <button onClick={() => ref.current.click()} style={{ width: "100%", padding: "20px 12px", borderRadius: 12, border: "2px dashed var(--brd)", background: "var(--bg)", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 6, fontFamily: "inherit", color: "var(--txtL)", fontSize: 12, marginBottom: 12 }}>
        <I.Upload s={22} /> <span>اضغط لرفع ملف</span>
      </button>
      <input ref={ref} type="file" accept={accept} onChange={handleFile} style={{ display: "none" }} />
    </div>
  );
};

const GrowthChart = ({ data, theme }) => {
  if (!data || data.length < 2) return <p style={{ color: "var(--txtL)", fontSize: 12, textAlign: "center" }}>بيانات غير كافية للرسم البياني</p>;
  const maxH = Math.max(...data.map(d => d.height));
  const minH = Math.min(...data.map(d => d.height));
  const range = maxH - minH || 1;
  return (
    <Card style={{ padding: 16 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)", marginBottom: 12 }}>📈 منحنى النمو</div>
      <svg viewBox={`0 0 ${data.length * 60} 130`} style={{ width: "100%", height: 120 }}>
        {data.map((d, i) => {
          const x = i * 60 + 30;
          const y = 100 - ((d.height - minH) / range) * 80;
          const next = data[i + 1];
          return (
            <g key={i}>
              {next && <line x1={x} y1={y} x2={(i + 1) * 60 + 30} y2={100 - ((next.height - minH) / range) * 80} stroke="var(--pri)" strokeWidth="2.5" />}
              <circle cx={x} cy={y} r="5" fill="var(--pri)" />
              <text x={x} y={y - 10} textAnchor="middle" fontSize="10" fill="var(--txt)" fontWeight="600">{d.height}</text>
              <text x={x} y="120" textAnchor="middle" fontSize="9" fill="var(--txtL)">{d.month}</text>
            </g>
          );
        })}
      </svg>
      <div style={{ textAlign: "center", fontSize: 11, color: "var(--ok)", fontWeight: 600, marginTop: 4 }}>
        النمو الكلي: +{maxH - minH} سم خلال {data.length} أشهر
      </div>
    </Card>
  );
};

  const [modal, setModal] = useState(null);
  const [search, setSearch] = useState("");
  const [subTab, setSubTab] = useState("info");

  const pt = selPt ? patients.find(x => x.id === selPt) : null;

  const updPt = (id, fn) => setPatients(ps => ps.map(p => p.id === id ? fn(p) : p));
  const delPt = (id) => { setPatients(ps => ps.filter(p => p.id !== id)); setTab("patients"); setSelPt(null); };

  const filtered = patients.filter(p => p.name.includes(search) || p.phone?.includes(search) || p.user.includes(search));
  const totalOwed = patients.reduce((s, p) => s + p.payments.filter(x => !x.paid).reduce((a, x) => a + x.amount, 0), 0);
  const totalPaid = patients.reduce((s, p) => s + p.payments.filter(x => x.paid).reduce((a, x) => a + x.amount, 0), 0);
  const upcoming = patients.flatMap(p => p.appts.filter(a => a.status === "قادم").map(a => ({ ...a, ptName: p.name, ptId: p.id }))).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
  const totalMeds = patients.reduce((s, p) => s + p.meds.filter(m => m.active).length, 0);

  // ── Modals
  const PatientForm = ({ patient, onClose }) => {
    const [f, setF] = useState(patient ? { ...patient } : { name: "", age: "", gender: "ذكر", height: "", weight: "", phone: "", status: "جديد", user: "", pass: "", avatar: null });
    const u = (k, v) => setF(p => ({ ...p, [k]: v }));
    return (
      <Modal title={patient ? "تعديل بيانات المريض" : "إضافة مريض جديد"} onClose={onClose}>
        <div style={{ textAlign: "center", marginBottom: 12 }}>
          <Avatar src={f.avatar} gender={f.gender} size={56} />
          <FileUpload label="" onUpload={file => u("avatar", file.data)} accept="image/*" />
        </div>
        <Inp label="الاسم الكامل" value={f.name} onChange={v => u("name", v)} placeholder="اسم المريض" />
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Inp label="العمر" value={f.age} onChange={v => u("age", v)} /></div>
          <div style={{ flex: 1 }}><Sel label="الجنس" value={f.gender} onChange={v => u("gender", v)} options={["ذكر", "أنثى"]} /></div>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Inp label="الطول (سم)" value={f.height} onChange={v => u("height", v)} /></div>
          <div style={{ flex: 1 }}><Inp label="الوزن (كغ)" value={f.weight} onChange={v => u("weight", v)} /></div>
        </div>
        <Inp label="رقم الهاتف" value={f.phone} onChange={v => u("phone", v)} placeholder="05xxxxxxxx" />
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Inp label="اسم المستخدم" value={f.user} onChange={v => u("user", v)} /></div>
          <div style={{ flex: 1 }}><Inp label="كلمة المرور" type="password" value={f.pass} onChange={v => u("pass", v)} /></div>
        </div>
        <Sel label="الحالة" value={f.status} onChange={v => u("status", v)} options={["جديد", "تحت المتابعة", "مراجعة", "مكتمل"]} />
        <Btn full onClick={() => {
          if (!f.name || !f.user || !f.pass) return;
          if (patient) { updPt(patient.id, p => ({ ...p, ...f, age: Number(f.age) })); }
          else { setPatients(ps => [...ps, { ...f, id: mkId(), age: Number(f.age), meds: [], appts: [], payments: [], program: null, growth: [], files: [], notes: [], messages: [], notifications: [] }]); }
          onClose();
        }}>💾 حفظ</Btn>
      </Modal>
    );
  };

  const MedForm = ({ onClose }) => {
    const [f, setF] = useState({ name: "", dose: "", time: "", active: true });
    return (
      <Modal title="إضافة دواء" onClose={onClose}>
        <Inp label="اسم الدواء" value={f.name} onChange={v => setF(p => ({ ...p, name: v }))} />
        <Inp label="الجرعة" value={f.dose} onChange={v => setF(p => ({ ...p, dose: v }))} placeholder="مثلاً: 500 ملغ" />
        <Inp label="وقت الأخذ" value={f.time} onChange={v => setF(p => ({ ...p, time: v }))} placeholder="مثلاً: بعد الفطور" />
        <Btn full onClick={() => { if (!f.name) return; updPt(selPt, p => ({ ...p, meds: [...p.meds, { ...f, id: mkId() }] })); onClose(); }}>💊 إضافة</Btn>
      </Modal>
    );
  };

  const ApptForm = ({ onClose }) => {
    const [f, setF] = useState({ date: "", time: "", type: "", status: "قادم" });
    return (
      <Modal title="إضافة موعد" onClose={onClose}>
        <Inp label="التاريخ" type="date" value={f.date} onChange={v => setF(p => ({ ...p, date: v }))} />
        <Inp label="الوقت" value={f.time} onChange={v => setF(p => ({ ...p, time: v }))} placeholder="10:00 ص" />
        <Inp label="نوع الزيارة" value={f.type} onChange={v => setF(p => ({ ...p, type: v }))} />
        <Sel label="الحالة" value={f.status} onChange={v => setF(p => ({ ...p, status: v }))} options={["قادم", "تم", "ملغي"]} />
        <Btn full onClick={() => { if (!f.date || !f.type) return; updPt(selPt, p => ({ ...p, appts: [...p.appts, { ...f, id: mkId() }] })); onClose(); }}>📅 إضافة</Btn>
      </Modal>
    );
  };

  const PayForm = ({ onClose }) => {
    const [f, setF] = useState({ date: new Date().toISOString().slice(0, 10), desc: "", amount: "", paid: false, receipt: null });
    return (
      <Modal title="إضافة دفعة" onClose={onClose}>
        <Inp label="التاريخ" type="date" value={f.date} onChange={v => setF(p => ({ ...p, date: v }))} />
        <Inp label="الوصف" value={f.desc} onChange={v => setF(p => ({ ...p, desc: v }))} placeholder="جلسة متابعة" />
        <Inp label="المبلغ (₪)" value={f.amount} onChange={v => setF(p => ({ ...p, amount: v }))} />
        <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "var(--txt)", margin: "0 0 12px", cursor: "pointer" }}>
          <input type="checkbox" checked={f.paid} onChange={e => setF(p => ({ ...p, paid: e.target.checked }))} /> تم الدفع
        </label>
        <FileUpload label="إيصال الدفع (اختياري)" onUpload={file => setF(p => ({ ...p, receipt: file.data }))} />
        <Btn full v="ok" onClick={() => { if (!f.amount) return; updPt(selPt, p => ({ ...p, payments: [...p.payments, { ...f, amount: Number(f.amount), id: mkId() }] })); onClose(); }}>💰 إضافة</Btn>
      </Modal>
    );
  };

  const NoteForm = ({ onClose }) => {

      </Modal>
    );

          <div style={{ flex: 1 }}><Inp label="الوزن (كغ)" value={f.weight} onChange={v => setF(p => ({ ...p, weight: v }))} /></div>

      <Modal title="البرنامج العلاجي" onClose={onClose}>

        </div>
        <Btn full onClick={() => { updPt(selPt, p => ({ ...p, program: f.name ? f : null })); onClose(); }}>💾 حفظ</Btn>
      </Modal>
    );
  };

  // ── Dashboard
  const Dash = () => (
    <div>
      <div style={{ background: `linear-gradient(135deg, var(--pri), var(--priD))`, borderRadius: 18, padding: 18, color: "#fff", marginBottom: 14 }}>
        <div style={{ fontSize: 17, fontWeight: 700 }}>مرحباً، د. أسامة 👋</div>
        <div style={{ fontSize: 12, opacity: 0.8 }}>لوحة تحكم العيادة</div>

          { icon: "📅", l: "مواعيد قادمة", v: upcoming.length, bg: "var(--warnL)" },
          { icon: "💰", l: "مستحقات", v: `${totalOwed} ₪`, bg: "var(--errL)" },
          { icon: "✅", l: "مدفوع", v: `${totalPaid} ₪`, bg: "var(--okL)" },

          <Card key={i}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <div style={{ width: 30, height: 30, borderRadius: 8, background: c.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>{c.icon}</div>
              <span style={{ fontSize: 11, color: "var(--txtL)" }}>{c.l}</span>
            </div>
            <div style={{ fontSize: 18, fontWeight: 700, color: "var(--txt)" }}>{c.v}</div>
          </Card>
        ))}
      </div>
      {upcoming.length > 0 && <>
        <h3 style={{ fontSize: 14, color: "var(--txt)", margin: "0 0 8px" }}>المواعيد القادمة</h3>
        {upcoming.map((a, i) => (
          <Card key={i} onClick={() => { setSelPt(a.ptId); setTab("pt_detail"); setSubTab("appts"); }} style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)" }}>{a.ptName}</div>
              <div style={{ fontSize: 11, color: "var(--txtL)" }}>{a.type}</div>
            </div>
            <div style={{ textAlign: "left" }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "var(--txt)" }}>{a.date}</div>
              <div style={{ fontSize: 11, color: "var(--txtL)" }}>{a.time}</div>
            </div>
          </Card>
        ))}
      </>}
    </div>
  );

  // ── Reports
  const Reports = () => {
    const medCounts = {};
    patients.forEach(p => p.meds.filter(m => m.active).forEach(m => { medCounts[m.name] = (medCounts[m.name] || 0) + 1; }));
    const topMeds = Object.entries(medCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const statusCounts = {};
    patients.forEach(p => { statusCounts[p.status] = (statusCounts[p.status] || 0) + 1; });
    return (
      <div>
        <h3 style={{ fontSize: 16, color: "var(--txt)", margin: "0 0 14px" }}>📊 التقارير</h3>
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)", marginBottom: 10 }}>ملخص مالي</div>
          {[["إجمالي المدفوع", `${totalPaid} ₪`, "var(--ok)"], ["المستحقات", `${totalOwed} ₪`, "var(--err)"], ["الإجمالي", `${totalPaid + totalOwed} ₪`, "var(--pri)"]].map(([l, v, c], i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: i < 2 ? "1px solid var(--brd)" : "none" }}>
              <span style={{ fontSize: 12, color: "var(--txtL)" }}>{l}</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: c }}>{v}</span>
            </div>
          ))}
        </Card>
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)", marginBottom: 10 }}>حالة المرضى</div>
          {Object.entries(statusCounts).map(([s, c], i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0" }}>
              <span style={{ fontSize: 12, color: "var(--txt)" }}>{s}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ width: 80, height: 6, borderRadius: 3, background: "var(--brd)", overflow: "hidden" }}>
                  <div style={{ width: `${(c / patients.length) * 100}%`, height: "100%", background: "var(--pri)", borderRadius: 3 }} />
                </div>
                <span style={{ fontSize: 12, fontWeight: 600, color: "var(--txt)", width: 20, textAlign: "center" }}>{c}</span>
              </div>
            </div>
          ))}
        </Card>
        <Card>
          <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)", marginBottom: 10 }}>أكثر الأدوية وصفاً</div>

          {topMeds.map(([name, count], i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: i < topMeds.length - 1 ? "1px solid var(--brd)" : "none" }}>
              <span style={{ fontSize: 12, color: "var(--txt)" }}>💊 {name}</span>
              <Badge text={`${count} مريض`} color="pri" />
            </div>
          ))}
        </Card>
      </div>

  // ── Patient Detail
  const PtDetail = () => {
    if (!pt) return null;
    const unpaid = pt.payments.filter(x => !x.paid).reduce((a, x) => a + x.amount, 0);
    const subs = [
      { k: "info", l: "البيانات" }, { k: "meds", l: "الأدوية" }, { k: "appts", l: "المواعيد" },
      { k: "pay", l: "الدفع" }, { k: "prog", l: "البرنامج" }, { k: "growth", l: "النمو" },
      { k: "files", l: "الملفات" }, { k: "notes", l: "الملاحظات" }, { k: "msg", l: "الرسائل" },
    ];
    return (
      <div>

                </div>
              </Card>
            ))}
          </div>

          <div>

              <Card key={a.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>

                  <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)" }}>{a.type}</div>

                    style={{ background: "none", border: "none", cursor: "pointer" }}>
                    <Badge text={a.status} color={a.status === "قادم" ? "warn" : a.status === "تم" ? "ok" : "err"} />
                  </button>
                  <button onClick={() => updPt(pt.id, p => ({ ...p, appts: p.appts.filter(x => x.id !== a.id) }))} style={{ background: "none", border: "none", color: "var(--err)", cursor: "pointer" }}><I.Del s={16} /></button>
                </div>
              </Card>

        {subTab === "pay" && (

              {[["🏦 بنك", "0599406182"], ["💜 بال باي", "0598165437"], ["📱 جوال باي", "0599406182"]].map(([m, n], i) => (

// ─── PATIENT APP ───
const PatientApp = ({ patient, patients, setPatients, onLogout, isDark, toggleDark }) => {
  const [tab, setTab] = useState("home");
  const [modal, setModal] = useState(null);
  const pt = patients.find(p => p.id === patient.id) || patient;
  const unpaid = pt.payments.filter(x => !x.paid).reduce((a, x) => a + x.amount, 0);

  const updPt = (fn) => setPatients(ps => ps.map(p => p.id === pt.id ? fn(p) : p));

  const PayOnlineModal = ({ onClose }) => {
    const [amount, setAmount] = useState(""); const [receipt, setReceipt] = useState(null); const [done, setDone] = useState(false);
    return (
      <Modal title="💳 دفع أونلاين" onClose={onClose}>
        {!done ? (
          <>
            <div style={{ textAlign: "center", marginBottom: 16 }}>
              <div style={{ fontSize: 11, color: "var(--txtL)" }}>المبلغ المستحق</div>
              <div style={{ fontSize: 28, fontWeight: 700, color: "var(--err)" }}>{unpaid} ₪</div>
            </div>
            <Card style={{ background: "var(--priL)", border: "1.5px solid var(--pri)" + "30", marginBottom: 14 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)", marginBottom: 8 }}>📱 طرق الدفع</div>
              {[
                { method: "🏦 بنك", number: "0599406182" },
                { method: "💜 بال باي", number: "0598165437" },
                { method: "📱 جوال باي", number: "0599406182" },
              ].map((p, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: i < 2 ? "1px solid var(--brd)" : "none" }}>
                  <span style={{ fontSize: 12, color: "var(--txtL)" }}>{p.method}</span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: "var(--txt)", direction: "ltr", letterSpacing: 1 }}>{p.number}</span>
                </div>
              ))}
            </Card>
            <Inp label="المبلغ المراد دفعه (₪)" type="number" value={amount} onChange={setAmount} placeholder={`الحد الأقصى: ${unpaid}`} />
            <FileUpload label="📸 أرفق إشعار الدفع البنكي" onUpload={file => setReceipt(file.data)} />
            {receipt && <div style={{ textAlign: "center", marginBottom: 12 }}><img src={receipt} alt="" style={{ width: 120, height: 80, objectFit: "cover", borderRadius: 10 }} /><p style={{ fontSize: 10, color: "var(--ok)" }}>✓ تم رفع الإشعار</p></div>}
            <Btn full v="ok" disabled={!amount || !receipt || Number(amount) <= 0 || Number(amount) > unpaid} onClick={() => {
              const payAmount = Number(amount);
              let remaining = payAmount;
              updPt(p => {
                const newPayments = p.payments.map(pay => {
                  if (!pay.paid && remaining > 0) {
                    if (remaining >= pay.amount) { remaining -= pay.amount; return { ...pay, paid: true, receipt }; }
                    else { const partial = remaining; remaining = 0; return { ...pay, amount: pay.amount - partial, receipt }; }
                  }
                  return pay;
                });
                return { ...p, payments: newPayments };
              });
              setDone(true);
            }}>✅ تأكيد الدفع</Btn>
          </>
        ) : (
          <div style={{ textAlign: "center", padding: 20 }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>✅</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: "var(--ok)" }}>تم الدفع بنجاح!</div>
            <div style={{ fontSize: 13, color: "var(--txtL)", margin: "8px 0 16px" }}>تم خصم {amount} ₪ من رصيدك المستحق</div>
            <Btn onClick={onClose}>إغلاق</Btn>
          </div>
        )}
      </Modal>
    );
  };

  const ChangePassModal = ({ onClose }) => {
    const [cur, setCur] = useState(""); const [nw, setNw] = useState(""); const [msg, setMsg] = useState("");
    return (
      <Modal title="🔑 تغيير كلمة المرور" onClose={onClose}>
        <Inp label="كلمة المرور الحالية" type="password" value={cur} onChange={setCur} />
        <Inp label="كلمة المرور الجديدة" type="password" value={nw} onChange={setNw} />
        {msg && <p style={{ fontSize: 12, color: msg.includes("✓") ? "var(--ok)" : "var(--err)", marginBottom: 8 }}>{msg}</p>}
        <Btn full onClick={() => {
          if (cur !== pt.pass) { setMsg("كلمة المرور الحالية غير صحيحة"); return; }
          if (nw.length < 4) { setMsg("كلمة المرور يجب أن تكون 4 أحرف على الأقل"); return; }
          updPt(p => ({ ...p, pass: nw })); setMsg("✓ تم تغيير كلمة المرور بنجاح");
        }}>تغيير</Btn>
      </Modal>
    );
  };

  const tabs = [

          <img src={LOGO} alt="" style={{ width: 28, height: "auto" }} />
          <span style={{ fontSize: 13, fontWeight: 700, color: "var(--txt)" }}>عيادة د. أسامة لبد</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <NotifBell notifications={pt.notifications} onRead={() => updPt(p => ({ ...p, notifications: p.notifications.map(n => ({ ...n, read: true })) }))} />
          <button onClick={onLogout} style={{ background: "none", border: "none", color: "var(--txtL)", cursor: "pointer" }}><I.Out s={18} /></button>

            <h3 style={{ fontSize: 16, color: "var(--txt)", margin: "0 0 12px" }}>ملفي الطبي</h3>
            <Card>
              {[["الاسم", pt.name], ["العمر", `${pt.age} سنة`], ["الجنس", pt.gender], ["الطول", `${pt.height} سم`], ["الوزن", `${pt.weight} كغ`], ["الحالة", pt.status]].map(([l, v], i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: i < 5 ? "1px solid var(--brd)" : "none", fontSize: 12 }}>
                  <span style={{ color: "var(--txtL)" }}>{l}</span><span style={{ fontWeight: 600, color: "var(--txt)" }}>{v}</span>
                </div>
              ))}
            </Card>
            {pt.files.length > 0 && <>
              <h4 style={{ fontSize: 13, color: "var(--txt)", margin: "12px 0 8px" }}>📎 ملفاتي (تحاليل / صور)</h4>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
                {pt.files.map(f => (
                  <div key={f.id} style={{ borderRadius: 8, overflow: "hidden", border: "1px solid var(--brd)" }}>
                    <img src={f.data} alt="" style={{ width: "100%", height: 60, objectFit: "cover" }} />
                    <div style={{ padding: 4, fontSize: 9, color: "var(--txtL)", textAlign: "center" }}>{f.date}</div>
                  </div>
                ))}
              </div>
            </>}
            {pt.notes.length > 0 && <>
              <h4 style={{ fontSize: 13, color: "var(--txt)", margin: "12px 0 8px" }}>📝 ملاحظات الطبيب</h4>
              {pt.notes.map(n => (
                <Card key={n.id}>
                  <div style={{ fontSize: 10, color: "var(--pri)", marginBottom: 4 }}>🩺 {n.by} — {n.date}</div>
                  <div style={{ fontSize: 12, color: "var(--txt)", lineHeight: 1.6 }}>{n.text}</div>
                </Card>
              ))}
            </>}
          </div>
        )}

        {tab === "meds" && (
          <div>
            <h3 style={{ fontSize: 16, color: "var(--txt)", margin: "0 0 12px" }}>💊 أدويتي</h3>
            {pt.meds.length === 0 && <p style={{ color: "var(--txtL)", fontSize: 12, textAlign: "center" }}>لا يوجد أدوية</p>}
            {pt.meds.map(m => (
              <Card key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, opacity: m.active ? 1 : 0.5 }}>
                <div style={{ width: 36, height: 36, borderRadius: 10, background: "var(--priL)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>💊</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)" }}>{m.name}</div>
                  <div style={{ fontSize: 11, color: "var(--txtL)" }}>{m.dose} • {m.time}</div>
                </div>
                <Badge text={m.active ? "فعّال" : "متوقف"} color={m.active ? "ok" : "warn"} />
              </Card>
            ))}
          </div>
        )}

        {tab === "appts" && (
          <div>
            <h3 style={{ fontSize: 16, color: "var(--txt)", margin: "0 0 12px" }}>📅 مواعيدي</h3>
            {pt.appts.map(a => (
              <Card key={a.id}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)" }}>{a.type}</div>
                    <div style={{ fontSize: 11, color: "var(--txtL)" }}>{a.date} • {a.time}</div>
                  </div>
                  <Badge text={a.status} color={a.status === "قادم" ? "warn" : a.status === "تم" ? "ok" : "err"} />
                </div>
              </Card>
            ))}
          </div>
        )}

        {tab === "pay" && (
          <div>
            <h3 style={{ fontSize: 16, color: "var(--txt)", margin: "0 0 12px" }}>💰 المدفوعات</h3>
            {unpaid > 0 && (
              <Card style={{ background: "var(--errL)", border: "1.5px solid var(--err)" + "30", textAlign: "center" }}>
                <div style={{ fontSize: 11, color: "var(--txtL)" }}>المبلغ المستحق</div>
                <div style={{ fontSize: 26, fontWeight: 700, color: "var(--err)", margin: "4px 0 10px" }}>{unpaid} ₪</div>
                <Btn v="ok" onClick={() => setModal("payOnline")}>💳 ادفع أونلاين</Btn>
              </Card>
            )}
            {pt.payments.map(p2 => (
              <Card key={p2.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "var(--txt)" }}>{p2.desc}</div>
                  <div style={{ fontSize: 11, color: "var(--txtL)" }}>{p2.date}</div>
                </div>
                <div style={{ textAlign: "left" }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: "var(--txt)" }}>{p2.amount} ₪</div>
                  <Badge text={p2.paid ? "مدفوع ✓" : "غير مدفوع"} color={p2.paid ? "ok" : "err"} />
                </div>
              </Card>
            ))}
          </div>
        )}

        {tab === "more" && (
          <div>
            <h3 style={{ fontSize: 16, color: "var(--txt)", margin: "0 0 14px" }}>المزيد</h3>
            {[
              { l: "💬 رسائل العيادة", k: "msg", count: pt.messages.length },
              { l: "🌱 برنامجي العلاجي", k: "prog" },
              { l: "📈 منحنى النمو", k: "growth" },
              { l: "🔑 تغيير كلمة المرور", k: "changePass" },
            ].map((item, i) => (
              <Card key={i} onClick={() => item.k === "changePass" ? setModal("changePass") : setTab(item.k)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ fontSize: 13, color: "var(--txt)" }}>{item.l}</span>
                <span style={{ fontSize: 12, color: "var(--txtL)" }}>‹</span>
              </Card>
            ))}
            <Card onClick={toggleDark} style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontSize: 13, color: "var(--txt)" }}>{isDark ? "☀️ الوضع النهاري" : "🌙 الوضع الليلي"}</span>
              <div style={{ width: 40, height: 22, borderRadius: 11, background: isDark ? "var(--pri)" : "var(--brd)", padding: 2, transition: "all 0.2s" }}>
                <div style={{ width: 18, height: 18, borderRadius: 9, background: "#fff", transform: isDark ? "translateX(0)" : "translateX(18px)", transition: "all 0.2s" }} />
              </div>
            </Card>
          </div>
        )}

        {tab === "msg" && (
          <div>
            <button onClick={() => setTab("more")} style={{ background: "var(--bg)", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", color: "var(--txtL)", fontSize: 12, marginBottom: 10, display: "flex", alignItems: "center", gap: 4 }}><I.Back s={16} /> رجوع</button>
            <MessagingView messages={pt.messages}
              onSend={text => updPt(p => ({ ...p, messages: [...p.messages, { from: "patient", text, time: new Date().toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" }) }] }))} />
          </div>
        )}

        {tab === "prog" && (
          <div>
            <button onClick={() => setTab("more")} style={{ background: "var(--bg)", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", color: "var(--txtL)", fontSize: 12, marginBottom: 10, display: "flex", alignItems: "center", gap: 4 }}><I.Back s={16} /> رجوع</button>
            <h3 style={{ fontSize: 16, color: "var(--txt)", margin: "0 0 12px" }}>🌱 برنامجي العلاجي</h3>
            {pt.program ? (
              <>
                <Card style={{ background: "var(--priL)" }}>
                  <div style={{ fontSize: 15, fontWeight: 700, color: "var(--txt)", marginBottom: 4 }}>{pt.program.name}</div>
                  <div style={{ fontSize: 11, color: "var(--txtL)", marginBottom: 8 }}>{pt.program.duration}</div>
                  <div style={{ background: "var(--brd)", borderRadius: 6, height: 8, overflow: "hidden", marginBottom: 4 }}>
                    <div style={{ width: `${pt.program.progress}%`, height: "100%", background: `linear-gradient(90deg, var(--pri), var(--ok))`, borderRadius: 6 }} />
                  </div>
                  <div style={{ fontSize: 11, color: "var(--ok)", fontWeight: 600 }}>{pt.program.progress}% مكتمل</div>
                </Card>
                {pt.program.steps.map((s, i) => (
                  <Card key={i} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <div style={{ width: 20, height: 20, borderRadius: 6, background: s.done ? "var(--okL)" : "var(--bg)", display: "flex", alignItems: "center", justifyContent: "center", border: s.done ? "none" : "1.5px solid var(--brd)" }}>
                      {s.done && <I.Check c="var(--ok)" />}
                    </div>
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 600, color: "var(--txt)" }}>{s.title}</div>
                      <div style={{ fontSize: 11, color: "var(--txtL)" }}>{s.desc}</div>
                    </div>
                  </Card>
                ))}
              </>
            ) : <Card style={{ textAlign: "center", padding: 30 }}><span style={{ fontSize: 32 }}>🌱</span><p style={{ color: "var(--txtL)", fontSize: 12, margin: "8px 0 0" }}>لم يتم تحديد برنامج بعد</p></Card>}
          </div>
        )}

        {tab === "growth" && (
          <div>
            <button onClick={() => setTab("more")} style={{ background: "var(--bg)", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", color: "var(--txtL)", fontSize: 12, marginBottom: 10, display: "flex", alignItems: "center", gap: 4 }}><I.Back s={16} /> رجوع</button>
            <h3 style={{ fontSize: 16, color: "var(--txt)", margin: "0 0 12px" }}>📈 منحنى النمو</h3>
            <GrowthChart data={pt.growth} />
          </div>
        )}
      </div>

      {modal === "payOnline" && <PayOnlineModal onClose={() => setModal(null)} />}
      {modal === "changePass" && <ChangePassModal onClose={() => setModal(null)} />}

      {!["msg", "prog", "growth"].includes(tab) && (
        <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, background: "var(--card)", borderTop: "1px solid var(--brd)", display: "flex", justifyContent: "space-around", padding: "6px 0 10px", zIndex: 10 }}>
          {tabs.map(t => (
            <button key={t.key} onClick={() => setTab(t.key)}
              style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 1, padding: "3px 4px",
                color: tab === t.key ? "var(--pri)" : "var(--txtL)" }}>
              <t.Icon />
              <span style={{ fontSize: 9, fontWeight: tab === t.key ? 600 : 400 }}>{t.l}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

// ─── MAIN APP ───
function App() {
  const [role, setRole] = useState(null);
  const [patients, setPatients] = useState(initPatients);
  const [isDark, setIsDark] = useState(false);
  const toggleDark = () => setIsDark(d => !d);

  const theme = isDark ? dark : light;
  const cssVars = Object.entries(theme).reduce((s, [k, v]) => s + `--${k}:${v};`, "");

  const handleLogin = (user, pass, setErr) => {
    if ((user === "admin" && pass === "admin123") || (user === "ziad" && pass === "ziad123")) { setRole("admin"); return; }
    const pt = patients.find(p => p.user === user && p.pass === pass);
    if (pt) { setRole(pt); return; }
    setErr("اسم المستخدم أو كلمة المرور غير صحيحة");
  };

  return (
    <div style={{ fontFamily: "'Segoe UI', Tahoma, Arial, sans-serif", ...Object.fromEntries(Object.entries(theme).map(([k, v]) => [`--${k}`, v])) }}>
      {!role && <LoginScreen onLogin={handleLogin} isDark={isDark} toggleDark={toggleDark} />}
      {role === "admin" && <AdminApp patients={patients} setPatients={setPatients} onLogout={() => setRole(null)} isDark={isDark} toggleDark={toggleDark} />}
      {role && role !== "admin" && <PatientApp patient={role} patients={patients} setPatients={setPatients} onLogout={() => setRole(null)} isDark={isDark} toggleDark={toggleDark} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js');
  });
}
</script>
</body>
</html>
