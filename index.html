function PatientApp({patient,patients,setPatients,onLogout,isDark,toggleDark}) {
  const T = isDark?dark:light;
  const [tab,setTab]=useState("home");
  const [viewPhoto,setViewPhoto]=useState(null);
  const pt = patients.find(p=>p.id===patient.id)||patient;
  const upd = (u)=>setPatients(prev=>prev.map(p=>p.id===pt.id?{...p,...u}:p));

  const tabs=[
    {key:"home",label:"الرئيسية",icon:I.Home},
    {key:"file",label:"ملفي",icon:I.File},
    {key:"meds",label:"الأدوية",icon:I.Pill},
    {key:"appts",label:"المواعيد",icon:I.Cal},
    {key:"pay",label:"الدفع",icon:I.Pay},
    {key:"prog",label:"البرنامج",icon:I.Clip},
    {key:"msg",label:"الرسائل",icon:I.Msg},
    {key:"growth",label:"النمو",icon:I.Chart},
    {key:"notif",label:"إشعارات",icon:I.Bell},
    {key:"settings",label:"إعدادات",icon:I.Lock},
  ];

  return (
    <div style={{minHeight:"100vh",background:T.bg,fontFamily:"'Segoe UI',Tahoma,sans-serif",direction:"rtl",maxWidth:430,margin:"0 auto",position:"relative",paddingBottom:70}}>
      <TopBar title="عيادة د. أسامة لبد" sub={`أهلاً ${pt.name}`} onLogout={onLogout} isDark={isDark} toggleDark={toggleDark} T={T} />
      <div style={{padding:"12px 14px"}}>
        {tab==="home"&&<PtHome pt={pt} T={T}/>}
        {tab==="file"&&<PtFile pt={pt} upd={upd} setViewPhoto={setViewPhoto} T={T}/>}
        {tab==="meds"&&<PtMeds pt={pt} T={T}/>}
        {tab==="appts"&&<PtAppts pt={pt} T={T}/>}
        {tab==="pay"&&<PtPay pt={pt} upd={upd} setViewPhoto={setViewPhoto} T={T}/>}
        {tab==="prog"&&<PtProg pt={pt} T={T}/>}
        {tab==="msg"&&<PtMsg pt={pt} upd={upd} T={T}/>}
        {tab==="growth"&&<PtGrowth pt={pt} T={T}/>}

      </div>
      <TabBar tabs={tabs} tab={tab} setTab={setTab} T={T}/>
      <PhotoModal src={viewPhoto} onClose={()=>setViewPhoto(null)}/>
    </div>

}

// ─── PT: PAYMENT ───
function PtPay({pt,upd,setViewPhoto,T}) {
  const [show,setShow]=useState(false);
  const [amt,setAmt]=useState(""); const [mth,setMth]=useState(PAY_METHODS[0].name);
  const ref=useRef(null); const [img,setImg]=useState(null);
  const handleImg = e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setImg(ev.target.result);r.readAsDataURL(f);e.target.value=""};
  const submit = ()=>{
    const a=parseFloat(amt);if(!a||a<=0||!img)return;
    upd({
      balance:pt.balance+a,
      payments:[...pt.payments,{id:Date.now(),date:new Date().toISOString().split("T")[0],amount:a,method:mth,status:"pending"}],
      paymentReceipts:[...(pt.paymentReceipts||[]),{id:Date.now(),amount:a,method:mth,date:new Date().toLocaleDateString("ar-EG"),img,status:"pending"}],
      notifications:[...(pt.notifications||[]),{id:Date.now(),text:`تم رفع إشعار دفع بمبلغ ${a} ₪`,date:new Date().toLocaleDateString("ar-EG"),read:false}],
    });
    setAmt("");setImg(null);setShow(false);
  };
  return <>
    <BalCard val={pt.balance} T={T} label="رصيدك الحالي"/>
    <Card T={T}>
      <h3 style={{margin:"0 0 12px",fontSize:15,color:T.pri}}>طرق الدفع</h3>
      {PAY_METHODS.map((pm,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<PAY_METHODS.length-1?`1px solid ${T.brd}`:"none"}}>
        <span style={{fontWeight:600,fontSize:13,color:T.txt}}>{pm.name}</span>
        <span style={{fontSize:14,fontFamily:"monospace",color:T.pri,fontWeight:700,direction:"ltr"}}>{pm.num}</span>
      </div>)}
    </Card>
    {!show?<Btn bg={T.acc} onClick={()=>setShow(true)} style={{marginBottom:12}}><I.Up s={18}/> رفع إشعار دفع</Btn>
    :<Card T={T}>
      <h3 style={{margin:"0 0 12px",fontSize:15,color:T.acc}}>رفع إشعار الدفع</h3>
      <div style={{marginBottom:10}}><Label T={T}>المبلغ المدفوع (₪)</Label><Input T={T} type="number" value={amt} onChange={e=>setAmt(e.target.value)} placeholder="أدخل المبلغ"/></div>
      <div style={{marginBottom:10}}><Label T={T}>طريقة الدفع</Label>
        <select style={{width:"100%",padding:"10px 14px",borderRadius:10,border:`1px solid ${T.brd}`,fontSize:14,background:T.card,color:T.txt}} value={mth} onChange={e=>setMth(e.target.value)}>
          {PAY_METHODS.map(pm=><option key={pm.name} value={pm.name}>{pm.name}</option>)}
        </select>
      </div>
      <div style={{marginBottom:12}}><Label T={T}>صورة الإشعار</Label>
        {img?<div style={{position:"relative"}}><img src={img} alt="" style={{width:"100%",maxHeight:200,objectFit:"contain",borderRadius:10,border:`2px solid ${T.ok}`}}/>
          <button onClick={()=>setImg(null)} style={{position:"absolute",top:4,left:4,background:T.err,color:"#fff",border:"none",borderRadius:"50%",width:24,height:24,cursor:"pointer",fontSize:14}}>✕</button></div>
        :<Btn bg={T.priL} color={T.pri} onClick={()=>ref.current?.click()} style={{border:`2px dashed ${T.pri}`}}><I.Cam s={20}/> التقط صورة أو اختر من المعرض</Btn>}
        <input ref={ref} type="file" accept="image/*" onChange={handleImg} style={{display:"none"}}/>
      </div>
      <div style={{display:"flex",gap:8}}>
        <Btn bg={(!amt||!img)?T.brd:T.ok} color={(!amt||!img)?T.txtS:"#fff"} disabled={!amt||!img} onClick={submit} style={{flex:1}}><I.Check s={18}/> إرسال</Btn>
        <Btn bg={T.errL} color={T.err} onClick={()=>{setShow(false);setImg(null);setAmt("")}} style={{flex:0.5}} full={false}>إلغاء</Btn>
      </div>
    </Card>}
    <Card T={T}><h3 style={{margin:"0 0 12px",fontSize:15,color:T.pri}}>سجل المدفوعات</h3>
      {pt.payments.length===0?<p style={{color:T.txtS,textAlign:"center",padding:16,fontSize:13}}>لا توجد مدفوعات</p>
      :pt.payments.map((p2,i)=><div key={p2.id||i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<pt.payments.length-1?`1px solid ${T.brd}`:"none"}}>
        <div><div style={{fontWeight:600,fontSize:13,color:T.txt}}>{p2.method}</div><div style={{fontSize:11,color:T.txtS}}>{p2.date}</div></div>
        <div style={{textAlign:"left"}}><div style={{fontWeight:700,fontSize:14,color:T.ok}}>+{p2.amount} ₪</div>
          <Badge text={p2.status==="confirmed"?"مؤكد":"قيد المراجعة"} color={p2.status==="confirmed"?"ok":"wrn"} T={T}/>
        </div>
      </div>)}
    </Card>
    {pt.paymentReceipts&&pt.paymentReceipts.length>0&&<Card T={T}>
      <h3 style={{margin:"0 0 12px",fontSize:15,color:T.pri}}>إشعارات الدفع المرفوعة</h3>
      {pt.paymentReceipts.map(r=><div key={r.id} style={{display:"flex",gap:10,alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${T.brd}`}}>
        <img src={r.img} alt="" style={{width:50,height:50,objectFit:"cover",borderRadius:8,cursor:"pointer"}} onClick={()=>setViewPhoto(r.img)}/>
        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13,color:T.txt}}>{r.amount} ₪ — {r.method}</div><div style={{fontSize:11,color:T.txtS}}>{r.date}</div></div>
        <Badge text={r.status==="confirmed"?"مؤكد":"بانتظار"} color={r.status==="confirmed"?"ok":"wrn"} T={T}/>
      </div>)}
    </Card>}
  </>;
}

// ─── PT: PROGRAM ───
function PtProg({pt,T}) {
  if(!pt.program) return <Card T={T}><p style={{color:T.txtS,textAlign:"center"}}>لا يوجد برنامج</p></Card>;
  const pct=Math.round(((pt.program.current+1)/pt.program.steps.length)*100);
  return <Card T={T}>
    <h3 style={{margin:"0 0 4px",fontSize:16,color:T.pri}}>{pt.program.name}</h3>
    <div style={{background:T.brd,borderRadius:20,height:8,marginBottom:14,marginTop:8,overflow:"hidden"}}><div style={{background:T.pri,height:"100%",borderRadius:20,width:`${pct}%`,transition:"width 0.5s"}}/></div>
    <div style={{fontSize:12,color:T.txtS,marginBottom:14,textAlign:"center"}}>{pct}% مكتمل</div>
    {pt.program.steps.map((step,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:i<pt.program.steps.length-1?`1px solid ${T.brd}`:"none"}}>
      <div style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,background:i<=pt.program.current?T.pri:T.brd,color:i<=pt.program.current?"#fff":T.txtS}}>{i<=pt.program.current?"✓":i+1}</div>
      <span style={{fontWeight:i===pt.program.current?700:400,color:i<=pt.program.current?T.txt:T.txtS,fontSize:14}}>{step}</span>
    </div>)}
  </Card>;
}

// ─── PT: MESSAGES ───
function PtMsg({pt,upd,T}) {
  const [txt,setTxt]=useState("");
  const send = ()=>{if(!txt.trim())return;upd({messages:[...(pt.messages||[]),{id:Date.now(),from:"patient",text:txt,date:new Date().toLocaleDateString("ar-EG"),time:new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}]});setTxt("")};
  return <Card T={T}>
    <h3 style={{margin:"0 0 12px",fontSize:16,color:T.pri}}>الرسائل</h3>
    <div style={{maxHeight:350,overflowY:"auto",marginBottom:12}}>
      {(!pt.messages||pt.messages.length===0)?<p style={{color:T.txtS,textAlign:"center",padding:20,fontSize:13}}>لا توجد رسائل</p>
      :pt.messages.map(m=><div key={m.id} style={{display:"flex",justifyContent:m.from==="patient"?"flex-start":"flex-end",marginBottom:8}}>
        <div style={{maxWidth:"80%",padding:"10px 14px",borderRadius:12,background:m.from==="patient"?T.priL:T.bg,color:T.txt}}>
          <div style={{fontSize:13}}>{m.text}</div>
          <div style={{fontSize:10,color:T.txtS,marginTop:4}}>{m.date} {m.time}</div>

      <Input T={T} value={txt} onChange={e=>setTxt(e.target.value)} placeholder="اكتب رسالة..." onKeyDown={e=>e.key==="Enter"&&send()} style={{flex:1}}/>
      <button onClick={send} style={{background:T.pri,border:"none",borderRadius:10,width:44,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}><I.Send s={18}/></button>

}

// ─── PT: SETTINGS (password change) ───
function PtSettings({pt,upd,T}) {
  const [oldP,setOldP]=useState(""); const [newP,setNewP]=useState(""); const [msg,setMsg]=useState("");
  const change = ()=>{
    if(oldP!==pt.pass){setMsg("كلمة المرور القديمة غير صحيحة");return}
    if(newP.length<4){setMsg("كلمة المرور الجديدة قصيرة جداً");return}
    upd({pass:newP});setOldP("");setNewP("");setMsg("تم تغيير كلمة المرور بنجاح ✓");
  };
  return <Card T={T}>
    <h3 style={{margin:"0 0 14px",fontSize:16,color:T.pri}}>تغيير كلمة المرور</h3>
    <div style={{marginBottom:10}}><Label T={T}>كلمة المرور الحالية</Label><Input T={T} type="password" value={oldP} onChange={e=>{setOldP(e.target.value);setMsg("")}}/></div>
    <div style={{marginBottom:14}}><Label T={T}>كلمة المرور الجديدة</Label><Input T={T} type="password" value={newP} onChange={e=>{setNewP(e.target.value);setMsg("")}}/></div>
    {msg&&<p style={{fontSize:12,color:msg.includes("✓")?T.ok:T.err,textAlign:"center",margin:"0 0 10px"}}>{msg}</p>}
    <Btn bg={T.pri} onClick={change}><I.Lock s={18}/> تغيير</Btn>
  </Card>;
}

// ─── ADMIN: HOME ───
function AdHome({patients,T}) {
  const totalBal = patients.reduce((s,p)=>s+p.balance,0);
  const negCount = patients.filter(p=>p.balance<0).length;
  const pendReceipts = patients.reduce((s,p)=>s+(p.paymentReceipts||[]).filter(r=>r.status==="pending").length,0);
  const totalPhotos = patients.reduce((s,p)=>s+(p.labPhotos||[]).length,0);
  const pendMsgs = patients.reduce((s,p)=>s+(p.messages||[]).filter(m=>m.from==="patient").length,0);
  return <>
    <Card T={T}><h3 style={{margin:"0 0 14px",fontSize:16,color:T.pri}}>إحصائيات العيادة</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {[["عدد المرضى",patients.length,T.priL,T.pri],["إجمالي الأرصدة",`${totalBal} ₪`,totalBal>=0?T.okL:T.errL,totalBal>=0?T.ok:T.err],["مرضى بديون",negCount,T.errL,T.err],["إشعارات دفع جديدة",pendReceipts,T.wrnL,T.wrn],["صور تحاليل",totalPhotos,T.priL,T.pri],["رسائل مرضى",pendMsgs,T.wrnL,T.wrn]]
        .map(([l,v,bg,c],i)=><div key={i} style={{background:bg,borderRadius:12,padding:14,textAlign:"center"}}>
          <div style={{fontSize:22,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:11,color:T.txtS,marginTop:2}}>{l}</div>
        </div>)}
      </div>
    </Card>
  </>;
}

// ─── ADMIN: PATIENTS LIST ───
function AdList({patients,setPatients,onSelect,T}) {
  const [show,setShow]=useState(false);
  const [f,setF]=useState({name:"",user:"",pass:"",age:"",phone:"",weight:"",height:"",diagnosis:""});
  const add = ()=>{
    if(!f.name||!f.user||!f.pass)return;
    setPatients(prev=>[...prev,{id:Date.now(),...f,age:+f.age||0,weight:+f.weight||0,height:+f.height||0,balance:0,meds:[],appointments:[],payments:[],program:null,labPhotos:[],paymentReceipts:[],notes:"",growthData:[],messages:[],notifications:[]}]);
    setF({name:"",user:"",pass:"",age:"",phone:"",weight:"",height:"",diagnosis:""});setShow(false);
  };
  return <>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <h3 style={{margin:0,fontSize:17,color:T.txt}}>المرضى ({patients.length})</h3>
      <BtnSm bg={show?T.err:T.pri} onClick={()=>setShow(!show)}>{show?<><I.X s={14}/> إلغاء</>:<><I.Plus s={14}/> إضافة</>}</BtnSm>
    </div>
    {show&&<Card T={T}>
      <h4 style={{margin:"0 0 12px",color:T.pri}}>مريض جديد</h4>
      {[["name","الاسم"],["user","اسم المستخدم"],["pass","كلمة المرور"],["age","العمر"],["phone","الهاتف"],["weight","الوزن"],["height","الطول"],["diagnosis","التشخيص"]].map(([k,l])=>(
        <div key={k} style={{marginBottom:8}}><Label T={T}>{l}</Label><Input T={T} value={f[k]} onChange={e=>setF({...f,[k]:e.target.value})} type={["age","weight","height"].includes(k)?"number":"text"}/></div>
      ))}
      <Btn bg={T.ok} onClick={add}><I.Check s={18}/> حفظ</Btn>
    </Card>}
    {patients.map(pt=><Card key={pt.id} T={T} style={{cursor:"pointer"}}><div onClick={()=>onSelect(pt.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><div style={{fontWeight:700,fontSize:14,color:T.txt}}>{pt.name}</div><div style={{fontSize:12,color:T.txtS}}>{pt.diagnosis} — {pt.age} سنوات</div></div>
      <div style={{textAlign:"left"}}><div style={{fontWeight:700,fontSize:14,color:pt.balance>=0?T.ok:T.err}}>{pt.balance} ₪</div><div style={{fontSize:10,color:T.txtS}}>@{pt.user}</div></div>
    </div></Card>)}
  </>;
}

// ─── ADMIN: PATIENT DETAIL ───
function AdDetail({pt,updPt,onBack,setViewPhoto,setPatients,T}) {
  const [balAdj,setBalAdj]=useState("");
  const [showMed,setShowMed]=useState(false);
  const [showAppt,setShowAppt]=useState(false);
  const [newMed,setNewMed]=useState({name:"",dose:"",time:""});
  const [newAppt,setNewAppt]=useState({date:"",time:"",note:""});
  const [noteEdit,setNoteEdit]=useState(false);
  const [noteVal,setNoteVal]=useState(pt.notes||"");
  const [msgTxt,setMsgTxt]=useState("");

  const adjustBal = ()=>{const a=parseFloat(balAdj);if(isNaN(a))return;updPt(pt.id,p=>({...p,balance:p.balance+a}));setBalAdj("")};
  const addMed = ()=>{if(!newMed.name)return;updPt(pt.id,p=>({...p,meds:[...p.meds,{id:Date.now(),...newMed}]}));setNewMed({name:"",dose:"",time:""});setShowMed(false)};
  const delMed = id=>updPt(pt.id,p=>({...p,meds:p.meds.filter(m=>m.id!==id)}));
  const addAppt = ()=>{if(!newAppt.date)return;updPt(pt.id,p=>({...p,appointments:[...p.appointments,{id:Date.now(),...newAppt,status:"upcoming"}]}));setNewAppt({date:"",time:"",note:""});setShowAppt(false)};
  const saveNote = ()=>{updPt(pt.id,p=>({...p,notes:noteVal}));setNoteEdit(false)};
  const sendMsg = ()=>{if(!msgTxt.trim())return;updPt(pt.id,p=>({...p,messages:[...(p.messages||[]),{id:Date.now(),from:"clinic",text:msgTxt,date:new Date().toLocaleDateString("ar-EG"),time:new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}]}));setMsgTxt("")};
  const delPt = ()=>{if(confirm("حذف المريض؟")){setPatients(prev=>prev.filter(p=>p.id!==pt.id));onBack()}};
  const confirmReceipt = rid=>updPt(pt.id,p=>({...p,paymentReceipts:(p.paymentReceipts||[]).map(r=>r.id===rid?{...r,status:"confirmed"}:r)}));

  return <>
    <button onClick={onBack} style={{background:"none",border:"none",color:T.pri,cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10,padding:0}}>→ رجوع</button>
    {/* Info */}
    <Card T={T}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <h3 style={{margin:0,fontSize:17,color:T.pri}}>{pt.name}</h3>
        <BtnSm bg={T.errL} color={T.err} onClick={delPt}><I.Del s={14}/> حذف</BtnSm>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        {[["المستخدم",pt.user],["العمر",pt.age],["الوزن",`${pt.weight} كغ`],["الطول",`${pt.height} سم`],["الهاتف",pt.phone],["التشخيص",pt.diagnosis]].map(([k,v])=>
          <div key={k} style={{padding:8,background:T.bg,borderRadius:8}}><div style={{fontSize:10,color:T.txtS}}>{k}</div><div style={{fontSize:13,fontWeight:600,color:T.txt}}>{v}</div></div>
        )}
      </div>
    </Card>
    {/* Balance */}
    <Card T={T}>
      <h4 style={{margin:"0 0 10px",fontSize:15,color:T.pri,display:"flex",alignItems:"center",gap:6}}><I.Wallet s={18}/> التحكم بالرصيد</h4>
      <BalCard val={pt.balance} T={T} label="الرصيد الحالي"/>
      <div style={{display:"flex",gap:8,marginBottom:6}}>
        <Input T={T} type="number" value={balAdj} onChange={e=>setBalAdj(e.target.value)} placeholder="المبلغ (+ أو -)" style={{flex:1}}/>
        <BtnSm bg={T.pri} onClick={adjustBal}>تعديل</BtnSm>
      </div>
      <p style={{fontSize:11,color:T.txtS,margin:"4px 0 0"}}>موجب لزيادة الرصيد، سالب لإنقاصه</p>
    </Card>
    {/* Notes */}
    <Card T={T}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <h4 style={{margin:0,fontSize:15,color:T.pri}}>ملاحظات طبية</h4>
        <BtnSm bg={noteEdit?T.ok:T.priL} color={noteEdit?"#fff":T.pri} onClick={()=>noteEdit?saveNote():setNoteEdit(true)}>{noteEdit?"حفظ":"تعديل"}</BtnSm>
      </div>
      {noteEdit?<textarea value={noteVal} onChange={e=>setNoteVal(e.target.value)} style={{width:"100%",minHeight:80,padding:10,borderRadius:10,border:`1px solid ${T.brd}`,fontSize:13,resize:"vertical",background:T.bg,color:T.txt,boxSizing:"border-box"}}/>
      :<p style={{fontSize:13,color:pt.notes?T.txt:T.txtS,margin:0}}>{pt.notes||"لا توجد ملاحظات"}</p>}
    </Card>
    {/* Lab Photos */}
    {pt.labPhotos&&pt.labPhotos.length>0&&<Card T={T}>
      <h4 style={{margin:"0 0 10px",fontSize:15,color:T.pri}}><I.Cam s={16}/> صور التحاليل ({pt.labPhotos.length})</h4>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
        {pt.labPhotos.map(ph=><div key={ph.id}><img src={ph.src} alt="" style={{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:10,border:`2px solid ${T.brd}`,cursor:"pointer"}} onClick={()=>setViewPhoto(ph.src)}/><div style={{fontSize:9,color:T.txtS,textAlign:"center"}}>{ph.date}</div></div>)}
      </div>
    </Card>}
    {/* Receipts */}
    {pt.paymentReceipts&&pt.paymentReceipts.length>0&&<Card T={T}>
      <h4 style={{margin:"0 0 10px",fontSize:15,color:T.acc}}><I.Bell s={16}/> إشعارات الدفع ({pt.paymentReceipts.length})</h4>
      {pt.paymentReceipts.map(r=><div key={r.id} style={{display:"flex",gap:10,alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${T.brd}`}}>
        <img src={r.img} alt="" style={{width:55,height:55,objectFit:"cover",borderRadius:8,cursor:"pointer"}} onClick={()=>setViewPhoto(r.img)}/>
        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13,color:T.txt}}>{r.amount} ₪ — {r.method}</div><div style={{fontSize:11,color:T.txtS}}>{r.date}</div></div>
        {r.status==="pending"?<BtnSm bg={T.ok} onClick={()=>confirmReceipt(r.id)}><I.Check s={14}/> تأكيد</BtnSm>:<Badge text="مؤكد ✓" color="ok" T={T}/>}
      </div>)}
    </Card>}
    {/* Meds */}
    <Card T={T}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h4 style={{margin:0,fontSize:15,color:T.pri}}>الأدوية</h4>
        <BtnSm bg={showMed?T.err:T.pri} onClick={()=>setShowMed(!showMed)}>{showMed?"إلغاء":<><I.Plus s={14}/> إضافة</>}</BtnSm>
      </div>
      {showMed&&<div style={{background:T.bg,borderRadius:10,padding:12,marginBottom:10}}>
        {[["name","اسم الدواء"],["dose","الجرعة"],["time","الوقت"]].map(([k,l])=><div key={k} style={{marginBottom:8}}><Label T={T}>{l}</Label><Input T={T} value={newMed[k]} onChange={e=>setNewMed({...newMed,[k]:e.target.value})}/></div>)}
        <Btn bg={T.ok} onClick={addMed}><I.Check s={16}/> حفظ</Btn>
      </div>}
      {pt.meds.map(m=><div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.brd}`}}>
        <div><div style={{fontWeight:600,fontSize:13,color:T.txt}}>{m.name}</div><div style={{fontSize:11,color:T.txtS}}>{m.dose} — {m.time}</div></div>
        <button onClick={()=>delMed(m.id)} style={{background:"none",border:"none",color:T.err,cursor:"pointer"}}><I.Del s={16}/></button>
      </div>)}
    </Card>
    {/* Appointments */}
    <Card T={T}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h4 style={{margin:0,fontSize:15,color:T.pri}}>المواعيد</h4>
        <BtnSm bg={showAppt?T.err:T.pri} onClick={()=>setShowAppt(!showAppt)}>{showAppt?"إلغاء":<><I.Plus s={14}/> إضافة</>}</BtnSm>
      </div>
      {showAppt&&<div style={{background:T.bg,borderRadius:10,padding:12,marginBottom:10}}>
        {[["date","التاريخ","date"],["time","الساعة","time"],["note","ملاحظة","text"]].map(([k,l,t])=><div key={k} style={{marginBottom:8}}><Label T={T}>{l}</Label><Input T={T} type={t} value={newAppt[k]} onChange={e=>setNewAppt({...newAppt,[k]:e.target.value})}/></div>)}
        <Btn bg={T.ok} onClick={addAppt}><I.Check s={16}/> حفظ</Btn>
      </div>}
      {pt.appointments.map(a=><div key={a.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${T.brd}`}}>
        <div><div style={{fontWeight:600,fontSize:13,color:T.txt}}>{a.date} — {a.time}</div><div style={{fontSize:11,color:T.txtS}}>{a.note}</div></div>
        <Badge text={a.status==="upcoming"?"قادم":"تم"} color={a.status==="upcoming"?"wrn":"ok"} T={T}/>
      </div>)}
    </Card>
    {/* Messaging */}
    <Card T={T}>
      <h4 style={{margin:"0 0 10px",fontSize:15,color:T.pri}}>إرسال رسالة للمريض</h4>
      <div style={{maxHeight:200,overflowY:"auto",marginBottom:8}}>
        {(pt.messages||[]).map(m=><div key={m.id} style={{display:"flex",justifyContent:m.from==="clinic"?"flex-start":"flex-end",marginBottom:6}}>
          <div style={{maxWidth:"80%",padding:"8px 12px",borderRadius:10,background:m.from==="clinic"?T.priL:T.bg,fontSize:12,color:T.txt}}>
            <div>{m.text}</div><div style={{fontSize:9,color:T.txtS,marginTop:2}}>{m.from==="clinic"?"العيادة":"المريض"} — {m.time}</div>
          </div>
        </div>)}
      </div>
      <div style={{display:"flex",gap:8}}>
        <Input T={T} value={msgTxt} onChange={e=>setMsgTxt(e.target.value)} placeholder="اكتب رسالة..." onKeyDown={e=>e.key==="Enter"&&sendMsg()} style={{flex:1}}/>
        <button onClick={sendMsg} style={{background:T.pri,border:"none",borderRadius:10,width:40,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}><I.Send s={16}/></button>
      </div>
    </Card>
    {/* Growth */}
    {pt.growthData&&pt.growthData.length>0&&<Card T={T}>
      <h4 style={{margin:"0 0 10px",fontSize:15,color:T.pri}}>منحنى النمو</h4>
      <ResponsiveContainer width="100%" height={160}>
        <LineChart data={pt.growthData}><CartesianGrid strokeDasharray="3 3" stroke={T.brd}/><XAxis dataKey="month" tick={{fontSize:9,fill:T.txtS}}/><YAxis tick={{fontSize:9,fill:T.txtS}}/><Tooltip/><Line type="monotone" dataKey="weight" stroke={T.pri} strokeWidth={2} dot={{r:3}}/><Line type="monotone" dataKey="height" stroke={T.acc} strokeWidth={2} dot={{r:3}}/></LineChart>
      </ResponsiveContainer>
    </Card>}
  </>;
}

// ─── ADMIN: RECEIPTS ───
function AdReceipts({patients,setPatients,setViewPhoto,T}) {
  const all = patients.flatMap(pt=>(pt.paymentReceipts||[]).map(r=>({...r,ptName:pt.name,ptId:pt.id})));
  const pending=all.filter(r=>r.status==="pending"), confirmed=all.filter(r=>r.status==="confirmed");
  const confirm = (ptId,rId)=>setPatients(prev=>prev.map(p=>p.id===ptId?{...p,paymentReceipts:(p.paymentReceipts||[]).map(r=>r.id===rId?{...r,status:"confirmed"}:r)}:p));
  return <>
    <h3 style={{margin:"0 0 14px",fontSize:17,color:T.txt}}>إشعارات الدفع</h3>
    {pending.length>0&&<Card T={T} style={{borderRight:`4px solid ${T.wrn}`}}>
      <h4 style={{margin:"0 0 10px",fontSize:14,color:T.wrn}}>بانتظار التأكيد ({pending.length})</h4>
      {pending.map(r=><div key={r.id} style={{display:"flex",gap:10,alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${T.brd}`}}>
        <img src={r.img} alt="" style={{width:55,height:55,objectFit:"cover",borderRadius:8,cursor:"pointer"}} onClick={()=>setViewPhoto(r.img)}/>
        <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13,color:T.txt}}>{r.ptName}</div><div style={{fontSize:12,color:T.txtS}}>{r.amount} ₪ — {r.method} — {r.date}</div></div>
        <BtnSm bg={T.ok} onClick={()=>confirm(r.ptId,r.id)}><I.Check s={14}/> تأكيد</BtnSm>
      </div>)}
    </Card>}
    {confirmed.length>0&&<Card T={T}>
      <h4 style={{margin:"0 0 10px",fontSize:14,color:T.ok}}>مؤكدة ({confirmed.length})</h4>
      {confirmed.map(r=><div key={r.id} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.brd}`}}>
        <img src={r.img} alt="" style={{width:45,height:45,objectFit:"cover",borderRadius:8,cursor:"pointer"}} onClick={()=>setViewPhoto(r.img)}/>
        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13,color:T.txt}}>{r.ptName}</div><div style={{fontSize:11,color:T.txtS}}>{r.amount} ₪</div></div>
        <Badge text="✓" color="ok" T={T}/>
      </div>)}
    </Card>}
    {all.length===0&&<Card T={T} style={{textAlign:"center",padding:30}}><I.Bell s={40}/><p style={{color:T.txtS,fontSize:13,marginTop:8}}>لا توجد إشعارات</p></Card>}
  </>;
}

// ─── ADMIN: PHOTOS ───
function AdPhotos({patients,setViewPhoto,T}) {
  const withPhotos = patients.filter(p=>p.labPhotos&&p.labPhotos.length>0);
  return <>
    <h3 style={{margin:"0 0 14px",fontSize:17,color:T.txt}}>صور التحاليل</h3>
    {withPhotos.length===0?<Card T={T} style={{textAlign:"center",padding:30}}><I.Img s={40}/><p style={{color:T.txtS,fontSize:13,marginTop:8}}>لا توجد صور</p></Card>
    :withPhotos.map(pt=><Card key={pt.id} T={T}>
      <h4 style={{margin:"0 0 10px",fontSize:14,color:T.pri}}>{pt.name} ({pt.labPhotos.length})</h4>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
        {pt.labPhotos.map(ph=><div key={ph.id}><img src={ph.src} alt="" style={{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:10,border:`2px solid ${T.brd}`,cursor:"pointer"}} onClick={()=>setViewPhoto(ph.src)}/><div style={{fontSize:9,color:T.txtS,textAlign:"center"}}>{ph.date}</div></div>)}
      </div>
    </Card>)}
  </>;
}

// ─── ADMIN: REPORTS ───
function AdReports({patients,T}) {
  const totalBal=patients.reduce((s,p)=>s+p.balance,0);
  const totalPaid=patients.reduce((s,p)=>s+p.payments.reduce((s2,pay)=>s2+pay.amount,0),0);
  return <>
    <h3 style={{margin:"0 0 14px",fontSize:17,color:T.txt}}>التقارير</h3>
    <Card T={T}>
      <h4 style={{margin:"0 0 12px",fontSize:15,color:T.pri}}>ملخص مالي</h4>
      {[["إجمالي الأرصدة",`${totalBal} ₪`,totalBal>=0?T.ok:T.err],["إجمالي المدفوعات",`${totalPaid} ₪`,T.ok],["مرضى برصيد إيجابي",patients.filter(p=>p.balance>0).length,T.ok],["مرضى برصيد سالب",patients.filter(p=>p.balance<0).length,T.err],["مرضى برصيد صفر",patients.filter(p=>p.balance===0).length,T.txtS]]
      .map(([l,v,c],i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${T.brd}`}}>
        <span style={{fontSize:13,color:T.txtS}}>{l}</span><span style={{fontSize:14,fontWeight:700,color:c}}>{v}</span>
      </div>)}
    </Card>
    <Card T={T}>
      <h4 style={{margin:"0 0 12px",fontSize:15,color:T.pri}}>تفاصيل المرضى</h4>
      {patients.map(pt=><div key={pt.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${T.brd}`}}>
        <div><div style={{fontWeight:600,fontSize:13,color:T.txt}}>{pt.name}</div><div style={{fontSize:11,color:T.txtS}}>{pt.meds.length} دواء — {pt.appointments.length} موعد</div></div>
        <div style={{fontWeight:700,fontSize:14,color:pt.balance>=0?T.ok:T.err}}>{pt.balance} ₪</div>
      </div>)}
    </Card>
  </>;
}

// ═══════════════════════════════════
//  MAIN
// ═══════════════════════════════════
const ClinicApp = function App() {
  const [role,setRole]=useState(null);
  const [patients,setPatients]=useState(initPts);
  const [isDark,setIsDark]=useState(false);

  const login = (u,p,setErr)=>{
    if((u==="admin"&&p==="admin123")||(u==="ziad"&&p==="ziad123")){setRole("admin");return}
    const pt=patients.find(x=>x.user===u&&x.pass===p);
    if(pt){setRole(pt);return}
    setErr("اسم المستخدم أو كلمة المرور غير صحيحة");
  };

  if(!role) return <LoginScreen onLogin={login} isDark={isDark} toggleDark={()=>setIsDark(d=>!d)}/>;
  if(role==="admin") return <AdminApp patients={patients} setPatients={setPatients} onLogout={()=>setRole(null)} isDark={isDark} toggleDark={()=>setIsDark(d=>!d)}/>;
  return <PatientApp patient={role} patients={patients} setPatients={setPatients} onLogout={()=>setRole(null)} isDark={isDark} toggleDark={()=>setIsDark(d=>!d)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ClinicApp));
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
